name: 현금흐름 갱신

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-cashflow
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the NH account and Jobis cards
        env:
          JOBIS_EMAIL: ${{ secrets.JOBIS_EMAIL }}
          JOBIS_PASSWORD: ${{ secrets.JOBIS_PASSWORD }}
        run: python3 scripts/refresh_jobis.py

      - name: Commit the updated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cashflow.json
          if git diff --cached --quiet; then
            echo "cashflow.json unchanged"
          else
            git commit -m "Update cashflow from the NH account"
            git push
          fi
